[project]
name = "feedback-by-chatgpt-and-human"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Takeshi Kondo", email = "ncukondo@gmail.com" }
]
dependencies = [
    "statsmodels>=0.14.1",
    "radian>=0.6.12",
    "jupyterlab>=4.1.5",
    "jupyter>=1.0.0",
    "pandas>=2.0.3",
    "ipykernel>=6.29.5",
]
readme = "README.md"
requires-python = ">= 3.8"

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/feedback_by_chatgpt_and_human"]
